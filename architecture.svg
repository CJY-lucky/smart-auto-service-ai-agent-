<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Smart Auto Service AI Agent 系统架构</title>
  <desc id="desc">五层架构（Web、API、Agents、Services、DB）、四个 Agent 协作、RAG 咨询链路与技师工位双资源排班示意</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font-family: 'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 14px; fill: #64748b; }
      .layer { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .layersub { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 13px; fill: #94a3b8; }
      .pill { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 12.5px; fill: #1e40af; }
      .pilllatin { font-family: 'Segoe UI',monospace; font-size: 12.5px; fill: #166534; }
      .note { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 12px; fill: #94a3b8; }
      .cardtitle { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .cardtext { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 12.5px; fill: #475569; }
      .chiptext { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 12.5px; fill: #334155; }
      .agentname { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 14px; font-weight: 600; fill: #0f766e; }
      .agentcap { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; font-size: 11.5px; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="940" fill="#ffffff"/>
  <text class="title" x="48" y="52">Smart Auto Service AI Agent · 系统架构</text>
  <text class="subtitle" x="48" y="80">面向汽车快修保养门店的智能预约与咨询系统：五层架构 · 四 Agent 协作 · 技师与工位双资源排班</text>

  <!-- ================= Web 层 ================= -->
  <rect x="48" y="116" width="756" height="98" rx="12" fill="#f8fbff" stroke="#dbe6f5"/>
  <rect x="48" y="116" width="6" height="98" rx="3" fill="#1f6feb"/>
  <text class="layer" x="72" y="146">Web 层</text>
  <text class="layersub" x="150" y="146">页面与静态资源</text>
  <g>
    <rect x="70" y="162" width="70" height="26" rx="13" fill="#eef4ff" stroke="#d7e3ff"/><text class="pill" x="105" y="180" text-anchor="middle">智能对话</text>
    <rect x="148" y="162" width="95" height="26" rx="13" fill="#eef4ff" stroke="#d7e3ff"/><text class="pill" x="195" y="180" text-anchor="middle">车间排班看板</text>
    <rect x="251" y="162" width="70" height="26" rx="13" fill="#eef4ff" stroke="#d7e3ff"/><text class="pill" x="286" y="180" text-anchor="middle">技师管理</text>
    <rect x="329" y="162" width="70" height="26" rx="13" fill="#eef4ff" stroke="#d7e3ff"/><text class="pill" x="364" y="180" text-anchor="middle">工位管理</text>
    <rect x="407" y="162" width="70" height="26" rx="13" fill="#eef4ff" stroke="#d7e3ff"/><text class="pill" x="442" y="180" text-anchor="middle">车辆档案</text>
    <rect x="485" y="162" width="70" height="26" rx="13" fill="#eef4ff" stroke="#d7e3ff"/><text class="pill" x="520" y="180" text-anchor="middle">车主行为</text>
    <rect x="563" y="162" width="58" height="26" rx="13" fill="#eef4ff" stroke="#d7e3ff"/><text class="pill" x="592" y="180" text-anchor="middle">知识库</text>
  </g>
  <text class="note" x="72" y="204">页面只做渲染，数据统一经 API 层获取</text>

  <line x1="426" y1="216" x2="426" y2="232" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= API 层 ================= -->
  <rect x="48" y="236" width="756" height="98" rx="12" fill="#f8fbff" stroke="#dbe6f5"/>
  <rect x="48" y="236" width="6" height="98" rx="3" fill="#6366f1"/>
  <text class="layer" x="72" y="266">API 层</text>
  <text class="layersub" x="150" y="266">接口编排与响应封装</text>
  <g>
    <rect x="70" y="282" width="70" height="26" rx="13" fill="#eef2ff" stroke="#dcdcfb"/><text class="pill" x="105" y="300" text-anchor="middle">任务分类</text>
    <rect x="148" y="282" width="70" height="26" rx="13" fill="#eef2ff" stroke="#dcdcfb"/><text class="pill" x="183" y="300" text-anchor="middle">咨询问答</text>
    <rect x="226" y="282" width="70" height="26" rx="13" fill="#eef2ff" stroke="#dcdcfb"/><text class="pill" x="261" y="300" text-anchor="middle">预约工单</text>
    <rect x="304" y="282" width="50" height="26" rx="13" fill="#eef2ff" stroke="#dcdcfb"/><text class="pill" x="329" y="300" text-anchor="middle">技师</text>
    <rect x="362" y="282" width="50" height="26" rx="13" fill="#eef2ff" stroke="#dcdcfb"/><text class="pill" x="387" y="300" text-anchor="middle">工位</text>
    <rect x="420" y="282" width="70" height="26" rx="13" fill="#eef2ff" stroke="#dcdcfb"/><text class="pill" x="455" y="300" text-anchor="middle">车辆档案</text>
    <rect x="498" y="282" width="58" height="26" rx="13" fill="#eef2ff" stroke="#dcdcfb"/><text class="pill" x="527" y="300" text-anchor="middle">知识库</text>
    <rect x="564" y="282" width="95" height="26" rx="13" fill="#eef2ff" stroke="#dcdcfb"/><text class="pill" x="611" y="300" text-anchor="middle">行为与提醒</text>
  </g>
  <text class="note" x="72" y="324">参数校验与响应封装；确定性排班接口可脱离大模型直接调用</text>

  <line x1="426" y1="336" x2="426" y2="352" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= Agents 层 ================= -->
  <rect x="48" y="356" width="756" height="190" rx="12" fill="#f7fdfd" stroke="#cdeceb"/>
  <rect x="48" y="356" width="6" height="190" rx="3" fill="#0d9488"/>
  <text class="layer" x="72" y="386">Agents 层</text>
  <text class="layersub" x="168" y="386">多 Agent 协作与任务路由</text>

  <rect x="70" y="398" width="250" height="44" rx="10" fill="#e6fffb" stroke="#99f6e4"/>
  <text class="agentname" x="195" y="419" text-anchor="middle">任务分类 Agent（主调度器）</text>
  <text class="agentcap" x="195" y="435" text-anchor="middle">意图识别 · 状态管理 · 路由</text>

  <line x1="195" y1="442" x2="195" y2="464" stroke="#2dd4bf" stroke-width="2.5"/>
  <line x1="175" y1="464" x2="645" y2="464" stroke="#2dd4bf" stroke-width="2.5"/>
  <line x1="175" y1="464" x2="175" y2="478" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="464" x2="410" y2="478" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="464" x2="645" y2="478" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="482" width="210" height="42" rx="10" fill="#ffffff" stroke="#bae6fd"/>
  <text class="agentname" x="175" y="508" text-anchor="middle" style="fill:#0369a1">咨询 Agent（RAG）</text>
  <rect x="305" y="482" width="210" height="42" rx="10" fill="#ffffff" stroke="#bae6fd"/>
  <text class="agentname" x="410" y="508" text-anchor="middle" style="fill:#0369a1">预约工单 Agent</text>
  <rect x="540" y="482" width="210" height="42" rx="10" fill="#ffffff" stroke="#bae6fd"/>
  <text class="agentname" x="645" y="508" text-anchor="middle" style="fill:#0369a1">车主行为 Agent</text>

  <text class="note" x="72" y="538">大模型只负责把车主口语翻译成结构化意图；能否排期由 Services 层的确定性算法判定</text>

  <line x1="426" y1="548" x2="426" y2="564" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= Services 层 ================= -->
  <rect x="48" y="568" width="756" height="110" rx="12" fill="#fffdf7" stroke="#f5e2c3"/>
  <rect x="48" y="568" width="6" height="110" rx="3" fill="#d97706"/>
  <text class="layer" x="72" y="598">Services 层</text>
  <text class="layersub" x="168" y="598">业务逻辑（唯一做业务判断的地方）</text>
  <g>
    <rect x="70" y="614" width="70" height="26" rx="13" fill="#fff7e6" stroke="#f5dfae"/><text class="pill" x="105" y="632" text-anchor="middle" style="fill:#92400e">排班调度</text>
    <rect x="148" y="614" width="70" height="26" rx="13" fill="#fff7e6" stroke="#f5dfae"/><text class="pill" x="183" y="632" text-anchor="middle" style="fill:#92400e">工单管理</text>
    <rect x="226" y="614" width="70" height="26" rx="13" fill="#fff7e6" stroke="#f5dfae"/><text class="pill" x="261" y="632" text-anchor="middle" style="fill:#92400e">技师服务</text>
    <rect x="304" y="614" width="70" height="26" rx="13" fill="#fff7e6" stroke="#f5dfae"/><text class="pill" x="339" y="632" text-anchor="middle" style="fill:#92400e">工位服务</text>
    <rect x="382" y="614" width="70" height="26" rx="13" fill="#fff7e6" stroke="#f5dfae"/><text class="pill" x="417" y="632" text-anchor="middle" style="fill:#92400e">车辆档案</text>
    <rect x="460" y="614" width="84" height="26" rx="13" fill="#fff7e6" stroke="#f5dfae"/><text class="pill" x="502" y="632" text-anchor="middle" style="fill:#92400e">知识库·向量</text>
    <rect x="552" y="614" width="70" height="26" rx="13" fill="#fff7e6" stroke="#f5dfae"/><text class="pill" x="587" y="632" text-anchor="middle" style="fill:#92400e">行为分析</text>
    <rect x="630" y="614" width="70" height="26" rx="13" fill="#fff7e6" stroke="#f5dfae"/><text class="pill" x="665" y="632" text-anchor="middle" style="fill:#92400e">提醒调度</text>
  </g>
  <text class="note" x="72" y="664">排班、金额、周期一律由代码计算；工位占用以工单表为准</text>

  <line x1="426" y1="680" x2="426" y2="696" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= DB 层 ================= -->
  <rect x="48" y="700" width="756" height="126" rx="12" fill="#f8fdf9" stroke="#cdebd8"/>
  <rect x="48" y="700" width="6" height="126" rx="3" fill="#16a34a"/>
  <text class="layer" x="72" y="730">DB 层</text>
  <text class="layersub" x="150" y="730">Repository 数据访问（唯一出现 SQL 的地方）</text>
  <g>
    <rect x="70" y="746" width="58" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="99" y="764" text-anchor="middle">Owner</text>
    <rect x="136" y="746" width="65" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="168" y="764" text-anchor="middle">Vehicle</text>
    <rect x="209" y="746" width="90" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="254" y="764" text-anchor="middle">WorkOrder</text>
    <rect x="307" y="746" width="85" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="349" y="764" text-anchor="middle">Technician</text>
    <rect x="400" y="746" width="88" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="444" y="764" text-anchor="middle">ServiceBay</text>
    <rect x="70" y="780" width="130" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="135" y="798" text-anchor="middle">KnowledgeDocument</text>
    <rect x="208" y="780" width="105" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="260" y="798" text-anchor="middle">OwnerBehavior</text>
    <rect x="321" y="780" width="122" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="382" y="798" text-anchor="middle">OwnerPreference</text>
    <rect x="451" y="780" width="110" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="506" y="798" text-anchor="middle">OwnerReminder</text>
    <rect x="569" y="780" width="112" height="26" rx="13" fill="#eaf7ef" stroke="#cbe9d7"/><text class="pilllatin" x="625" y="798" text-anchor="middle">EmbeddingCache</text>
  </g>
  <text class="note" x="72" y="818">默认 SQLite（SQLAlchemy），工单的 bay_plan 字段记录跨工位分段计划</text>

  <!-- ================= 右侧卡片 1：调用方向 ================= -->
  <rect x="828" y="116" width="324" height="150" rx="12" fill="#fafbfd" stroke="#e2e8f0"/>
  <rect x="828" y="116" width="6" height="150" rx="3" fill="#94a3b8"/>
  <text class="cardtitle" x="848" y="146">调用方向（只允许向下）</text>
  <text class="cardtext" x="848" y="176">Web → API → Agents → Services → DB</text>
  <text class="cardtext" x="848" y="200">下层不得反向调用上层</text>
  <text class="cardtext" x="848" y="224">Agents 不绕过 Services 访问数据库</text>
  <text class="cardtext" x="848" y="248">页面与对外接口共用同一套 Services</text>

  <!-- ================= 右侧卡片 2：RAG ================= -->
  <rect x="828" y="286" width="324" height="240" rx="12" fill="#fafbfd" stroke="#e2e8f0"/>
  <rect x="828" y="286" width="6" height="240" rx="3" fill="#0d9488"/>
  <text class="cardtitle" x="848" y="316">RAG 咨询链路</text>
  <rect x="848" y="328" width="284" height="26" rx="8" fill="#eef4ff" stroke="#d7e3ff"/><text class="chiptext" x="990" y="346" text-anchor="middle">任务分类判定为「咨询」</text>
  <line x1="990" y1="354" x2="990" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="848" y="360" width="284" height="26" rx="8" fill="#eef4ff" stroke="#d7e3ff"/><text class="chiptext" x="990" y="378" text-anchor="middle">咨询 Agent 发起检索（top 3）</text>
  <line x1="990" y1="386" x2="990" y2="392" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="848" y="392" width="284" height="26" rx="8" fill="#eef4ff" stroke="#d7e3ff"/><text class="chiptext" x="990" y="410" text-anchor="middle">FAISS 向量召回 + 关键词加权</text>
  <line x1="990" y1="418" x2="990" y2="424" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="848" y="424" width="284" height="26" rx="8" fill="#eef4ff" stroke="#d7e3ff"/><text class="chiptext" x="990" y="442" text-anchor="middle">拼接门店知识上下文</text>
  <line x1="990" y1="450" x2="990" y2="456" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="848" y="456" width="284" height="26" rx="8" fill="#e0f2fe" stroke="#bae6fd"/><text class="chiptext" x="990" y="474" text-anchor="middle">生成回答（红灯类问题先给安全提示）</text>
  <text class="note" x="848" y="502">知识库为门店知识条目，检索取相关性最高的 3 条</text>
  <text class="note" x="848" y="518">Embedding 结果做内存 + 数据库两级缓存</text>

  <!-- ================= 右侧卡片 3：双资源排班 ================= -->
  <rect x="828" y="546" width="324" height="258" rx="12" fill="#fafbfd" stroke="#e2e8f0"/>
  <rect x="828" y="546" width="6" height="258" rx="3" fill="#d97706"/>
  <text class="cardtitle" x="848" y="576">双资源排班</text>
  <text class="cardtext" x="848" y="600">一个工单同时占用：</text>
  <rect x="848" y="610" width="284" height="26" rx="8" fill="#fff7e6" stroke="#f5dfae"/><text class="chiptext" x="990" y="628" text-anchor="middle">1 名持证技师 —— 占用整段工时</text>
  <rect x="848" y="642" width="284" height="26" rx="8" fill="#fff7e6" stroke="#f5dfae"/><text class="chiptext" x="990" y="660" text-anchor="middle">1 个类型匹配工位 —— 按工序分段</text>
  <text class="cardtext" x="848" y="690">示例：换轮胎 + 四轮定位（含 5 分钟转移）</text>
  <rect x="848" y="700" width="284" height="20" rx="5" fill="#99f6e4" stroke="#5eead4"/>
  <text class="chiptext" x="990" y="715" text-anchor="middle" style="fill:#0f766e">技师 张伟（整段占用 · 共 125 分钟）</text>
  <rect x="848" y="728" width="136" height="20" rx="5" fill="#bfdbfe" stroke="#93c5fd"/>
  <text class="chiptext" x="916" y="743" text-anchor="middle" style="fill:#1e40af">举升机工位A</text>
  <rect x="995" y="728" width="137" height="20" rx="5" fill="#c7d2fe" stroke="#a5b4fc"/>
  <text class="chiptext" x="1063" y="743" text-anchor="middle" style="fill:#3730a3">四轮定位工位</text>

  <text class="cardtext" x="848" y="772">排不上时返回冲突原因 + 备选时段，由 Agent 转述</text>
  <text class="cardtext" x="848" y="792">写入临界区内二次校验，避免并发排出冲突工单</text>
  <rect x="48" y="850" width="1104" height="64" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="cardtitle" x="70" y="888">外部依赖</text>
  <rect x="150" y="866" width="130" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text class="chiptext" x="215" y="885" text-anchor="middle">DeepSeek 对话模型</text>
  <rect x="292" y="866" width="168" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text class="chiptext" x="376" y="885" text-anchor="middle">Embedding（本地或云端）</text>
  <rect x="472" y="866" width="120" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text class="chiptext" x="532" y="885" text-anchor="middle">天气服务（可选）</text>
  <rect x="604" y="866" width="120" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text class="chiptext" x="664" y="885" text-anchor="middle">MCP 工具（可选）</text>
  <text class="note" x="1132" y="885" text-anchor="end">未配置密钥时自动降级为规则模式，可全程离线运行</text>
</svg>